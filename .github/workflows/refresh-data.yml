name: Daily Baseball Data Refresh
on:
  schedule:
    # Scheduled runs at the top of the hour are queued behind everyone else's; they started 1-9 hours late
    # at ':00'. Use an off-peak minute. The time of day itself doesn't matter: games finish well before this.
    #
    # Paused for the offseason: this only runs March through October, because stats don't move in the offseason.
    # Before the first run of a new season (the "Yearly rollover" note in refresh/config.ts has the details):
    #   1. Make sure data/baselines/baseline-hitters-<year>.csv and baseline-pitchers-<year>.csv exist for CURRENT_YEAR - 3 .. CURRENT_YEAR - 1
    #      (build the finished season with: npm run refresh:baseline -- <year>).
    #   2. Bump CURRENT_YEAR in refresh/config.ts once the new season has games.
    #   3. Run this workflow by hand with publish=false and confirm it passes, for a few days, before the cron resumes.
    # Scheduled runs wait a random 0-3 hours before fetching (see the step below), so the run time varies. workflow_dispatch
    # below still works at any time, and manual runs do not wait.
    - cron: '37 10 * 3-10 *'
  workflow_dispatch:  # Allows manual trigger
    inputs:
      publish:
        description: 'Open and auto-merge the refresh PR. Set to false to only run the refresh (dry run).'
        type: boolean
        default: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    # Up to 3 hours of random wait, then the refresh, then up to 30 minutes for the PR to merge and 20 for the deploy.
    timeout-minutes: 300
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # The refresh only needs the root package's dev tools (tsx), but a full install keeps the lockfile check simple.
      - name: Install dependencies
        run: npm ci

      # A fixed time of day makes a machine-like pattern for the sites we read. Scheduled runs wait a random 0-3 hours
      # first (games finish well before 10:37 UTC, and even the longest wait is still morning in the US). This only
      # avoids a rigid pattern; it does not guarantee a site will not challenge us. What keeps the load low is the
      # volume (about seven requests per run) and an honest User-Agent. If a run is ever refused, the app keeps serving
      # the last good CSVs and the failure monitor reports it. Manual runs start at once.
      - name: Wait a random time before fetching (scheduled runs only)
        if: github.event_name == 'schedule'
        run: |
          delay=$(( (RANDOM * 32768 + RANDOM) % 10800 ))
          echo "Waiting ${delay} seconds before fetching."
          sleep "${delay}"

      - name: Refresh baseball data
        run: npm run refresh

      # With no games being played the stat files come out identical, but data/data_freshness.json still advances
      # its date. That would open a PR every day and, because analysis cache validity follows the data-through
      # date, regenerate every cached take for no new information. Keep the previous freshness file in that
      # case so no PR is opened; the next real stat change opens one as usual.
      - name: Skip freshness-only updates
        run: |
          if git diff --quiet -- data/full_stats_hitters.csv data/full_stats_pitchers.csv data/player_lookup.csv; then
            echo "Stat files are unchanged; discarding the freshness-only update."
            git checkout -- data/data_freshness.json
          else
            echo "Stat files changed; keeping the refresh."
          fi

      - name: Validate refresh PR token
        if: github.event.inputs.publish != 'false'
        env:
          REFRESH_PR_TOKEN: ${{ secrets.REFRESH_PR_TOKEN }}
        run: |
          if [[ -z "${REFRESH_PR_TOKEN}" ]]; then
            echo "REFRESH_PR_TOKEN secret is not set."
            exit 1
          fi

      - name: Set refresh metadata
        id: refresh_meta
        run: |
          echo "refresh_date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
          echo "refresh_timestamp=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"

      - name: Create pull request for refreshed data
        id: cpr
        if: github.event.inputs.publish != 'false'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.REFRESH_PR_TOKEN }}
          branch: automated/daily-data-refresh
          branch-suffix: timestamp
          delete-branch: true
          commit-message: "Daily baseball data refresh ${{ steps.refresh_meta.outputs.refresh_date }}"
          title: "Daily baseball data refresh ${{ steps.refresh_meta.outputs.refresh_date }}"
          body: |
            Automated daily refresh generated at `${{ steps.refresh_meta.outputs.refresh_timestamp }}` for:
            - `data/full_stats_hitters.csv`
            - `data/full_stats_pitchers.csv`
            - `data/player_lookup.csv`
          add-paths: |
            data/full_stats_hitters.csv
            data/full_stats_pitchers.csv
            data/player_lookup.csv
            data/data_freshness.json

      - name: Enable auto-merge for refresh PR
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.REFRESH_PR_TOKEN }}
        run: |
          gh pr merge --auto --squash \
            --subject "Daily baseball data refresh ${{ steps.refresh_meta.outputs.refresh_date }}" \
            "${{ steps.cpr.outputs.pull-request-number }}"

      # The trend snapshot copies whatever data the running server has loaded, once per date. It used to run on
      # its own cron and could land before this refresh had merged and deployed, snapshotting yesterday's data
      # under today's date for good. So it now runs from this workflow, only once the new data is live.
      - name: Wait for the refresh PR to merge
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.REFRESH_PR_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          for _ in $(seq 1 60); do
            state=$(gh pr view "${PR_NUMBER}" --json state --jq .state)
            [[ "${state}" == "MERGED" ]] && exit 0
            if [[ "${state}" == "CLOSED" ]]; then
              echo "::error::Refresh PR #${PR_NUMBER} was closed without merging."
              exit 1
            fi
            sleep 30
          done
          echo "::error::Refresh PR #${PR_NUMBER} did not merge within 30 minutes."
          exit 1

      - name: Wait for the refreshed data to be live
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          TRENDS_SNAPSHOT_URL: ${{ secrets.TRENDS_SNAPSHOT_URL }}
        run: |
          git fetch --quiet --depth=1 origin master
          expected=$(git show origin/master:data/data_freshness.json | jq -r .data_through_date)
          base="${TRENDS_SNAPSHOT_URL%%/api/*}"
          for _ in $(seq 1 40); do
            live=$(curl --silent --max-time 30 "${base}/api/data-freshness" | jq -r '.dataThroughDate // empty' || true)
            if [[ "${live}" == "${expected}" ]]; then
              echo "Live data is through ${live}."
              exit 0
            fi
            echo "Live data is through '${live:-unknown}', waiting for ${expected}."
            sleep 30
          done
          echo "::error::The deployed app did not reach data through ${expected} within 20 minutes."
          exit 1

  trends:
    needs: refresh
    if: github.event.inputs.publish != 'false'
    uses: ./.github/workflows/generate-trend-snapshots.yml
    secrets: inherit

  # A single failure email is easy to write off as a blip. This job fails with a message that says how many
  # runs in a row have failed, and when the live data is stale in season, so the email reads differently.
  monitor:
    needs: [refresh, trends]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check refresh health
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          REFRESH_RESULT: ${{ needs.refresh.result }}
          TRENDS_RESULT: ${{ needs.trends.result }}
          TRENDS_SNAPSHOT_URL: ${{ secrets.TRENDS_SNAPSHOT_URL }}
        run: |
          problems=()

          if [[ "${REFRESH_RESULT}" == "failure" || "${TRENDS_RESULT}" == "failure" ]]; then
            # Count the failed runs immediately before this one, newest first, stopping at the first non-failure.
            streak=1
            while read -r conclusion; do
              [[ "${conclusion}" == "failure" ]] || break
              streak=$((streak + 1))
            done < <(gh run list --workflow refresh-data.yml --branch master --limit 30 \
              --json databaseId,status,conclusion \
              --jq ".[] | select(.status == \"completed\" and .databaseId != (${RUN_ID} | tonumber)) | .conclusion")
            echo "Consecutive failed refresh runs, including this one: ${streak}" | tee -a "${GITHUB_STEP_SUMMARY}"
            if (( streak >= 2 )); then
              problems+=("The daily data refresh has failed ${streak} runs in a row.")
            fi
          fi

          # Regular season only: stats legitimately stand still in the offseason.
          month=$(date -u +%-m)
          base="${TRENDS_SNAPSHOT_URL%%/api/*}"
          live=$(curl --silent --max-time 30 --retry 3 "${base}/api/data-freshness" | jq -r '.dataThroughDate // empty' || true)
          if [[ -z "${live}" ]]; then
            echo "::warning::Could not read the live data date from ${base}/api/data-freshness."
          else
            age=$(( ( $(date -u +%s) - $(date -u -d "${live}" +%s) ) / 86400 ))
            echo "Live data is through ${live} (${age} days old)." | tee -a "${GITHUB_STEP_SUMMARY}"
            if (( month >= 4 && month <= 9 && age > 3 )); then
              problems+=("The live data is ${age} days old (through ${live}) during the season.")
            fi
          fi

          for problem in "${problems[@]}"; do
            echo "::error::${problem}"
          done
          (( ${#problems[@]} == 0 ))
